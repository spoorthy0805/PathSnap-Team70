[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap"
version = "0.1.0"
description = "Map-matching noisy GPS trajectories with ML candidate scoring and HMM/Viterbi decoding"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
